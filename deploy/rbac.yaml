apiVersion: v1
kind: ServiceAccount
metadata:
  name: inferverify
  namespace: inferverify-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inferverify
rules:
  - apiGroups: ["verification.inferguard.io"]
    resources: ["inferencechecks"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["verification.inferguard.io"]
    resources: ["inferencechecks/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inferverify
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: inferverify
subjects:
  - kind: ServiceAccount
    name: inferverify
    namespace: inferverify-system
---
# The verification Job runs in the check's namespace and writes the result into
# a ConfigMap. It uses that namespace's default ServiceAccount, so that SA needs
# configmap read/write there. This ClusterRole + binding grant it cluster-wide;
# scope it down to a Role/RoleBinding per namespace if you prefer.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inferverify-job
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inferverify-job
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: inferverify-job
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default

