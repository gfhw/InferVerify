apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: inferencechecks.verification.inferguard.io
spec:
  group: verification.inferguard.io
  names:
    kind: InferenceCheck
    listKind: InferenceCheckList
    plural: inferencechecks
    singular: inferencecheck
    shortNames:
      - ic
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: Desired inference verification
              required:
                - releaseRef
                - target
              properties:
                releaseRef:
                  type: string
                  description: The ModelRelease this check verifies
                revision:
                  type: integer
                  description: Helm revision being verified
                engine:
                  type: string
                  description: Inference engine (vllm/tgi/sglang)
                target:
                  type: string
                  description: Inference service URL, e.g. http://llama-3-8b:8000
                suites:
                  type: array
                  description: Robot suites to run (empty = smoke)
                  items:
                    type: string
                thresholds:
                  type: object
                  description: Assertion thresholds passed to the suites as variables
                  x-kubernetes-preserve-unknown-fields: true
                approval:
                  type: object
                  description: Human approval gate for passing verifications
                  properties:
                    required:
                      type: boolean
                      description: If true, a passing verification waits for approval
                    approved:
                      type: boolean
                      description: User sets true to approve
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: Pending | Verified | Degraded | Unknown
                passedCases:
                  type: integer
                failedCases:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                progress:
                  type: object
                  description: Live execution progress (event/test/status)
                  x-kubernetes-preserve-unknown-fields: true
                reportURL:
                  type: string
                message:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Release
          type: string
          jsonPath: .spec.releaseRef
        - name: Revision
          type: integer
          jsonPath: .spec.revision
